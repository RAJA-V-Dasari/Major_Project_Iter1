[project]
name = "major-project-eval"
version = "0.1.0"
description = "Mark handwritten CIE answer booklets against the official schemes, and measure the result against the examiner's own marks."
requires-python = ">=3.11"

# Deliberately split. Everything except the semantic tier runs on a
# laptop with no ML stack at all; `grade.py --all --no-semantic` must
# keep working when the extras are absent, so the ladder degrades rather
# than breaks. There is no --no-llm and there does not need to be: that
# tier is a queue written to disk, not an in-process call, so a laptop
# with no GPU simply leaves queue_llm.jsonl unanswered.
dependencies = [
    "pymupdf>=1.24",   # render the scanned schemes; there is no text layer
    "pillow>=10.0",    # cover crops, contact sheets
    "numpy>=1.26",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",  # tier 2 only, CPU, MiniLM
]

[tool.setuptools]
packages = []
