[project]
name = "major-project-eval-local"
version = "0.1.0"
description = "Mark handwritten CIE answer booklets against the official schemes, and measure the result against the examiner's own marks. Local edition: the model tier runs on this machine."
requires-python = ">=3.11"

# Deliberately split, and still split even though the model tier is now
# local. Everything except the semantic tier runs on a laptop with no ML
# stack at all; `grade.py --all --no-semantic` must keep working when the
# extras are absent, so the ladder degrades rather than breaks.
#
# The model tier adds NOTHING here on purpose. Its default backend is a
# local Ollama server reached over HTTP with `urllib` from the standard
# library, so running Qwen locally costs this file zero dependencies -
# the model lives in Ollama's store, not in site-packages. The
# `llama-cpp` extra below is the fallback for a machine where installing
# Ollama is not an option, and it is an extra because it builds from
# source on Windows unless a matching wheel exists.
dependencies = [
    "pymupdf>=1.24",   # render the scanned schemes; there is no text layer
    "pillow>=10.0",    # cover crops, contact sheets
    "numpy>=1.26",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",  # tier 2 only, CPU, MiniLM
]
llama-cpp = [
    "llama-cpp-python>=0.2.80",    # only for --backend llama-cpp
]

[tool.setuptools]
packages = []
